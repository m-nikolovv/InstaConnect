events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream identity {
        zone identity 64k;
        server identity-svc:80 resolve;
    }
    upstream posts {
        zone posts 64k;
        server posts-svc:80 resolve;
    }
    upstream chats {
        zone chats 64k;
        hash $remote_addr consistent;
        server chats-svc:80 resolve;
    }
    upstream follows {
        zone follows 64k;
        hash $remote_addr consistent;
        server follows-svc:80 resolve;
    }

    server {
        listen 80;
        server_name $hostname;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /identity/ {
            proxy_pass http://identity/;
        }

        location /posts/ {
            proxy_pass http://posts/;
        }

        location /chats/ {
            proxy_pass http://chats/;
        }

        location /follows/ {
            proxy_pass http://follows/;
        }

        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}
