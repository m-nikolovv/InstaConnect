worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=50r/s;
    limit_req_status 429;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/plain;

    keepalive_timeout 65s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    upstream identity {
        zone identity 64k;
        server identity-svc:80 resolve;
        keepalive 64;
    }
    upstream posts {
        zone posts 64k;
        server posts-svc:80 resolve;
        keepalive 64;
    }
    upstream chats {
        zone chats 64k;
        hash $remote_addr consistent;
        server chats-svc:80 resolve;
        keepalive 64;
    }
    upstream follows {
        zone follows 64k;
        server follows-svc:80 resolve;
        keepalive 64;
    }

    server {
        listen 80;
        server_name $hostname;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /identity/ {
            limit_req zone=per_ip burst=100 nodelay;
            proxy_pass http://identity/;
        }

        location /posts/ {
            limit_req zone=per_ip burst=100 nodelay;
            proxy_pass http://posts/;
        }

        location /chats/ {
            limit_req zone=per_ip burst=100 nodelay;
            proxy_read_timeout 1h;
            proxy_pass http://chats/;
        }

        location /follows/ {
            limit_req zone=per_ip burst=100 nodelay;
            proxy_pass http://follows/;
        }

        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}
