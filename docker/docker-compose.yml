networks:
  instaconnect:

services:
  observability:
    image: grafana/otel-lgtm:latest
    container_name: observability
    hostname: observability
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./.containers/observability:/data
    healthcheck:
      test: cat /tmp/ready
      interval: 1m
      timeout: 10s
      retries: 10
      start_period: 1m
      start_interval: 10s
    networks:
      - instaconnect

  mongo:
    image: mongo:latest
    container_name: mongo
    hostname: mongo
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - |
        head -c 756 /dev/urandom | base64 -w0 > /etc/mongo-keyfile
        chmod 400 /etc/mongo-keyfile
        chown mongodb:mongodb /etc/mongo-keyfile
        exec docker-entrypoint.sh "$$@"
      - mongo-entrypoint
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile"]
    volumes:
      - ./.containers/mongo/data/db:/data/db
      - ./mongo/scripts:/docker-entrypoint-initdb.d:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGODB_USERNAME: ${MONGO_USERNAME}
      MONGODB_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_USERNAME}", "-p", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - instaconnect

  redis:
    image: redis:latest
    container_name: redis
    hostname: redis
    restart: always
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --masterauth ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ./.containers/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - instaconnect

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}" user_${KAFKA_USERNAME}="${KAFKA_PASSWORD}";
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        user_${KAFKA_USERNAME}="${KAFKA_PASSWORD}";
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9094:9094"
    volumes:
      - ./.containers/kafka/data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="%s" password="%s";\n'
          "${KAFKA_USERNAME}" "${KAFKA_PASSWORD}" > /tmp/healthcheck.properties &&
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 --command-config /tmp/healthcheck.properties > /dev/null 2>&1
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks:
      - instaconnect

  identity-svc:
    image: ${DOCKER_REGISTRY-}identity-svc
    container_name: identity-svc
    hostname: identity-svc
    build:
      context: ..
      dockerfile: src/Services/Identity/InstaConnect.Identity.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:80
      AdminConfiguration__Email: "${ADMIN_EMAIL}"
      AdminConfiguration__Password: "${ADMIN_PASSWORD}"
      SendGridConfiguration__Sender: "${SEND_GRID_SENDER}"
      SendGridConfiguration__ApiKey: "${SEND_GRID_API_KEY}"
      AccessTokenConfiguration__SecurityKey: "${ACCESS_TOKEN_SECURITY_KEY}"
      MongoConfiguration__Name: "instaconnect_identity"
      MongoConfiguration__ConnectionString: "mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/instaconnect_identity?replicaSet=rs0&authSource=admin"
      KafkaConfiguration__ConnectionString: "kafka:9092"
      KafkaConfiguration__Username: "${KAFKA_USERNAME}"
      KafkaConfiguration__Password: "${KAFKA_PASSWORD}"
      RedisConfiguration__ConnectionString: "redis:6379,password=${REDIS_PASSWORD},abortConnect=False"
      CloudinaryConfiguration__CloudName: ${CLOUDINARY_CLOUD_NAME}
      CloudinaryConfiguration__ApiKey: ${CLOUDINARY_API_KEY}
      CloudinaryConfiguration__ApiSecret: ${CLOUDINARY_API_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --tries=1 --no-verbose http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s
    depends_on:
      observability:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - instaconnect

  posts-svc:
    image: ${DOCKER_REGISTRY-}posts-svc
    container_name: posts-svc
    hostname: posts-svc
    build:
      context: ..
      dockerfile: src/Services/Posts/InstaConnect.Posts.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:80
      AccessTokenConfiguration__SecurityKey: "${ACCESS_TOKEN_SECURITY_KEY}"
      MongoConfiguration__Name: "instaconnect_posts"
      MongoConfiguration__ConnectionString: "mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/instaconnect_posts?replicaSet=rs0&authSource=admin"
      KafkaConfiguration__ConnectionString: "kafka:9092"
      KafkaConfiguration__Username: "${KAFKA_USERNAME}"
      KafkaConfiguration__Password: "${KAFKA_PASSWORD}"
      CloudinaryConfiguration__CloudName: ${CLOUDINARY_CLOUD_NAME}
      CloudinaryConfiguration__ApiKey: ${CLOUDINARY_API_KEY}
      CloudinaryConfiguration__ApiSecret: ${CLOUDINARY_API_SECRET}
      AnthropicConfiguration__ApiKey: ${ANTHROPIC_API_KEY}
      AnthropicConfiguration__Model: ${ANTHROPIC_MODEL}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --tries=1 --no-verbose http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s
    depends_on:
      observability:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - instaconnect

  chats-svc:
    image: ${DOCKER_REGISTRY-}chats-svc
    container_name: chats-svc
    hostname: chats-svc
    build:
      context: ..
      dockerfile: src/Services/Chats/InstaConnect.Chats.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:80
      AccessTokenConfiguration__SecurityKey: "${ACCESS_TOKEN_SECURITY_KEY}"
      MongoConfiguration__Name: "instaconnect_chats"
      MongoConfiguration__ConnectionString: "mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/instaconnect_chats?replicaSet=rs0&authSource=admin"
      KafkaConfiguration__ConnectionString: "kafka:9092"
      KafkaConfiguration__Username: "${KAFKA_USERNAME}"
      KafkaConfiguration__Password: "${KAFKA_PASSWORD}"
      RedisConfiguration__ConnectionString: "redis:6379,password=${REDIS_PASSWORD},abortConnect=False"
      CloudinaryConfiguration__CloudName: ${CLOUDINARY_CLOUD_NAME}
      CloudinaryConfiguration__ApiKey: ${CLOUDINARY_API_KEY}
      CloudinaryConfiguration__ApiSecret: ${CLOUDINARY_API_SECRET}
      AnthropicConfiguration__ApiKey: ${ANTHROPIC_API_KEY}
      AnthropicConfiguration__Model: ${ANTHROPIC_MODEL}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --tries=1 --no-verbose http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s
    depends_on:
      observability:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - instaconnect

  follows-svc:
    image: ${DOCKER_REGISTRY-}follows-svc
    container_name: follows-svc
    hostname: follows-svc
    build:
      context: ..
      dockerfile: src/Services/Follows/InstaConnect.Follows.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:80
      AccessTokenConfiguration__SecurityKey: "${ACCESS_TOKEN_SECURITY_KEY}"
      MongoConfiguration__Name: "instaconnect_follows"
      MongoConfiguration__ConnectionString: "mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/instaconnect_follows?replicaSet=rs0&authSource=admin"
      KafkaConfiguration__ConnectionString: "kafka:9092"
      KafkaConfiguration__Username: "${KAFKA_USERNAME}"
      KafkaConfiguration__Password: "${KAFKA_PASSWORD}"
      RedisConfiguration__ConnectionString: "redis:6379,password=${REDIS_PASSWORD},abortConnect=False"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --tries=1 --no-verbose http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s
    depends_on:
      observability:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - instaconnect

  gateway-svc:
    image: nginx:alpine
    container_name: gateway-svc
    hostname: gateway-svc
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --tries=1 --no-verbose http://127.0.0.1:80/nginx_status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      identity-svc:
        condition: service_healthy
      posts-svc:
        condition: service_healthy
      chats-svc:
        condition: service_healthy
      follows-svc:
        condition: service_healthy
    networks:
      - instaconnect
