version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
    ignore:
      - dependency-name: 'MassTransit*'
        versions: ['>= 9.0.0']
      - dependency-name: 'MediatR'
        versions: ['>= 13.0.0']
      - dependency-name: 'Serilog.Sinks.OpenTelemetry'
        versions: ['4.2.1-nblumhardt-02317']

  - package-ecosystem: docker
    directories:
      - /src/Services/*/InstaConnect.*.Presentation
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
