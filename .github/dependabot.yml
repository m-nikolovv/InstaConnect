version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # v9+ is commercially licensed; v8 stays Apache-2.0
      - dependency-name: 'MassTransit*'
        versions: ['>= 9.0.0']
      # v13+ is RPL-1.5 or commercially licensed; v12 stays Apache-2.0
      - dependency-name: 'MediatR'
        versions: ['>= 13.0.0']

  - package-ecosystem: docker
    directories:
      - /src/Services/*/InstaConnect.*.Presentation
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
